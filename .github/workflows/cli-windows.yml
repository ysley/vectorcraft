# A build of vectorcraft-cli for Windows, for trying `vectorcraft-cli script` without installing
# Rust. It runs on every push to extendscript-compat (and by hand: Actions › "Windows CLI (test
# build)" › Run workflow, once this file is on the default branch); download the artifact from the run.
name: Windows CLI (test build)

on:
  push:
    branches: [extendscript-compat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vectorcraft-cli -p vectorcraft
      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-cli-windows
          path: target/release/vectorcraft-cli.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-app-windows
          path: target/release/vectorcraft.exe
          if-no-files-found: error
